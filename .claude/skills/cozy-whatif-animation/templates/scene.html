<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cozy Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=block" rel="stylesheet">
<style>
  /* ---------- Palette tokens (see SKILL.md section 1) ---------- */
  :root {
    --ink: #1A1A2E;
    --white: #FFFFFF;
    --white-shade: #DCDDEB;
    --wall: #6A5EBF;
    --wall-dark: #4E449A;
    --blanket: #E8433A;
    --blanket-fold: #BE2F2A;
    --pj: #2F6FE6;
    --pj-shade: #1E52C0;
    --wood: #9A5A34;
    --wood-dark: #6E3B1F;
    --title-yellow: #FFE53B;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }

  /* Anything animated inside the SVG transforms around its own box. */
  .anim { transform-box: fill-box; }

  /* ---------- Motion (see SKILL.md section 2) ----------
     All loops divide evenly into 16 s, so a 16 s render loops seamlessly. */
  #camera   { transform-origin: 30% 70%; animation: push 8s ease-in-out infinite alternate; }
  #breath   { transform-origin: 50% 100%; animation: breathe 4s ease-in-out infinite alternate; }
  #head     { transform-origin: 50% 50%; animation: bob 4s ease-in-out infinite alternate; }
  #glow     { animation: glow 4s ease-in-out infinite alternate; }
  .star     { transform-origin: 50% 50%; animation: twinkle 2s ease-in-out infinite alternate; }
  .star:nth-child(3n)   { animation-duration: 4s; animation-delay: -1.3s; }
  .star:nth-child(3n+1) { animation-delay: -0.7s; }
  .zzz      { transform-origin: 50% 50%; opacity: 0; animation: zzz 4s ease-out infinite; }
  .zzz.z2   { animation-delay: 1.33s; }
  .zzz.z3   { animation-delay: 2.66s; }
  .title    { transform-origin: 50% 60%; animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
  .title.t2 { animation-delay: .25s; }

  @keyframes push    { from { transform: scale(1); } to { transform: scale(1.04); } }
  @keyframes breathe { from { transform: scaleY(1); } to { transform: scaleY(1.035); } }
  @keyframes bob     { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-6px) rotate(-1.2deg); } }
  @keyframes glow    { from { opacity: .82; } to { opacity: 1; } }
  @keyframes twinkle { from { opacity: .3; transform: scale(.75); } to { opacity: 1; transform: scale(1.1); } }
  @keyframes zzz {
    0%   { opacity: 0; transform: translate(0, 0) rotate(-8deg) scale(.6); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translate(70px, -150px) rotate(10deg) scale(1.15); }
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* ---------- Title text ---------- */
  .title text {
    font-family: 'Lilita One', 'Luckiest Guy', 'Arial Black', sans-serif;
    text-anchor: middle;
    stroke: var(--ink);
    stroke-linejoin: round;
    paint-order: stroke;          /* stroke sits outside the fill */
  }
  .title { filter: drop-shadow(0 9px 0 var(--ink)); }   /* hard shadow, no blur */
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1B44"/>
      <stop offset="1" stop-color="#22327A"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFE7A3" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#FFC56B" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#FFC56B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="windowClip"><rect x="1460" y="150" width="380" height="540" rx="6"/></clipPath>
    <clipPath id="headClip"><circle cx="0" cy="0" r="200"/></clipPath>
  </defs>

  <g id="camera">
    <!-- ===== Background: wall ===== -->
    <rect width="1920" height="1080" fill="var(--wall)"/>
    <polygon points="0,0 820,0 1420,1080 0,1080" fill="#8577D6" opacity=".35"/>   <!-- light wedge -->
    <rect x="1380" y="0" width="540" height="1080" fill="var(--wall-dark)" opacity=".35"/>

    <!-- ===== Window ===== -->
    <g>
      <rect x="1440" y="130" width="420" height="580" rx="14" fill="#5A4FA8" stroke="var(--ink)" stroke-width="6"/>
      <g clip-path="url(#windowClip)">
        <rect x="1460" y="150" width="380" height="540" fill="url(#sky)"/>
        <g id="stars" fill="#FFF6C8">
          <circle class="star anim" cx="1510" cy="210" r="5"/>
          <circle class="star anim" cx="1600" cy="300" r="4"/>
          <circle class="star anim" cx="1700" cy="190" r="6"/>
          <circle class="star anim" cx="1790" cy="260" r="4"/>
          <circle class="star anim" cx="1540" cy="400" r="4"/>
          <circle class="star anim" cx="1660" cy="430" r="5"/>
          <circle class="star anim" cx="1780" cy="380" r="5"/>
          <circle class="star anim" cx="1620" cy="520" r="3"/>
          <path class="star anim" d="M1740 480 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8z"/>
        </g>
        <!-- treetop silhouettes -->
        <path d="M1460 690 V600 q30-50 70-20 q20-60 80-30 q40-50 90 0 q40-40 80 10 q40-20 60 30 V690z" fill="#16224F"/>
      </g>
      <line x1="1650" y1="150" x2="1650" y2="690" stroke="#5A4FA8" stroke-width="14"/>
      <line x1="1460" y1="420" x2="1840" y2="420" stroke="#5A4FA8" stroke-width="14"/>
      <rect x="1420" y="700" width="460" height="28" rx="8" fill="#5A4FA8" stroke="var(--ink)" stroke-width="5"/>
    </g>

    <!-- ===== Lamp + glow ===== -->
    <circle id="glow" cx="130" cy="330" r="420" fill="url(#lampGlow)"/>
    <g stroke="var(--ink)" stroke-width="5" stroke-linejoin="round">
      <rect x="118" y="380" width="22" height="150" fill="#C9A15E"/>
      <path d="M40 395 L220 395 L188 245 L72 245 Z" fill="#FFE7A3"/>
      <ellipse cx="129" cy="532" rx="70" ry="14" fill="#C9A15E"/>
    </g>

    <!-- ===== Headboard ===== -->
    <g stroke="var(--ink)" stroke-width="6" stroke-linejoin="round">
      <rect x="-20" y="540" width="820" height="300" rx="18" fill="var(--wood)"/>
      <rect x="-20" y="520" width="840" height="46" rx="14" fill="var(--wood-dark)"/>
      <rect x="760" y="500" width="54" height="360" rx="12" fill="var(--wood-dark)"/>
    </g>

    <!-- ===== Character (breathing) ===== -->
    <g id="breath" class="anim">
      <!-- body: blue hoodie curled on its side -->
      <g stroke="var(--ink)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
        <path d="M560 700 C640 610 860 600 990 660 C1090 705 1110 830 1060 920 L600 940 C560 870 540 770 560 700Z" fill="var(--pj)"/>
        <path d="M640 690 C740 650 860 650 940 690" fill="none" stroke="var(--pj-shade)" stroke-width="10"/>
        <!-- sleeve tucked under chin -->
        <path d="M600 980 C590 900 650 850 760 850 C830 850 860 900 840 960" fill="var(--pj)"/>
        <path d="M700 880 C740 900 770 920 790 950" fill="none" stroke="var(--pj-shade)" stroke-width="10"/>
      </g>

      <!-- head -->
      <g id="head" class="anim">
        <g transform="translate(450 770) rotate(-12)">
          <circle r="200" fill="var(--white)"/>
          <!-- single cel shade, away from the lamp -->
          <g clip-path="url(#headClip)">
            <circle cx="70" cy="60" r="200" fill="var(--white-shade)"/>
            <circle cx="20" cy="10" r="200" fill="var(--white)"/>
          </g>
          <circle r="200" fill="none" stroke="var(--ink)" stroke-width="9"/>
          <!-- face: sleepy arcs + small smile + blush -->
          <g fill="none" stroke="var(--ink)" stroke-width="11" stroke-linecap="round">
            <path d="M-95 20 Q-55 55 -15 22"/>
            <path d="M45 10 Q85 45 125 12"/>
            <path d="M5 95 Q25 112 48 98"/>
          </g>
          <ellipse cx="-80" cy="75" rx="26" ry="14" fill="#FF9DB0" opacity=".45"/>
          <ellipse cx="120" cy="65" rx="26" ry="14" fill="#FF9DB0" opacity=".45"/>
        </g>
      </g>

      <!-- mitten hand -->
      <path d="M560 930 C540 880 600 860 640 880 C690 900 690 960 640 975 C600 985 570 965 560 930Z"
            fill="var(--white)" stroke="var(--ink)" stroke-width="9" stroke-linejoin="round"/>
    </g>

    <!-- ===== Blanket (foreground) ===== -->
    <g stroke-linejoin="round" stroke-linecap="round">
      <path d="M-30 1100 L-30 900 C100 860 250 960 420 975 C520 985 560 960 620 950
               C760 930 860 880 1000 860 C1180 830 1300 900 1480 860 C1640 825 1780 800 1950 830 L1950 1100Z"
            fill="var(--blanket)" stroke="var(--ink)" stroke-width="9"/>
      <g fill="none" stroke="var(--blanket-fold)" stroke-width="12">
        <path d="M60 960 C180 940 260 1010 360 1040"/>
        <path d="M700 990 C820 950 940 960 1040 1020"/>
        <path d="M1100 930 C1220 910 1300 960 1380 1000"/>
        <path d="M1500 920 C1600 890 1720 900 1820 950"/>
        <path d="M880 1060 C960 1040 1060 1050 1150 1080"/>
      </g>
    </g>

    <!-- ===== Zzz ===== -->
    <g font-family="'Lilita One', 'Arial Black', sans-serif" fill="var(--white)" stroke="var(--ink)"
       stroke-width="8" paint-order="stroke" stroke-linejoin="round">
      <text class="zzz anim"    x="680" y="600" font-size="70">Z</text>
      <text class="zzz anim z2" x="680" y="600" font-size="70">Z</text>
      <text class="zzz anim z3" x="680" y="600" font-size="70">Z</text>
    </g>
  </g>

  <!-- ===== Title (outside camera so it stays still) ===== -->
  <g class="title anim">
    <text x="960" y="230" font-size="230" fill="var(--title-yellow)" stroke-width="32">WHAT IF YOU</text>
  </g>
  <g class="title t2 anim">
    <text x="1010" y="420" font-size="170" fill="var(--white)" stroke-width="26">NEVER SLEPT?</text>
  </g>
</svg>
</body>
</html>
