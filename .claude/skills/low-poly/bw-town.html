  background:linear-gradient(#3a6ea8,#27507e);border:6px solid #fff;border-left:0;border-radius:0 12px 12px 0;box-shadow:0 0 0 6px #1b2a3c;transform:translateX(-120%)}

import * as THREE from "three";

let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });

function dith(m) {                                 // 15-bit colour + ordered dither (no vertex wobble: the map has to stay readable)
  m.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
    { const float BY[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);

      gl_FragColor.rgb = clamp(floor(gl_FragColor.rgb * 31.0 + th + 0.5) / 31.0, 0.0, 1.0); }`); };

const mats = {};
const M = (c) => mats[c] || (mats[c] = dith(new THREE.MeshLambertMaterial({ color: c, flatShading: true })));

function mkTex(w, h, draw) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); draw(g);
  const t = new THREE.CanvasTexture(cv); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace; return t; }
const GW = 30, GH = 40, TP = 16;                   // map in tiles, 16 px per tile; ground spans x -15..15, z -24..16

    g.fillStyle = '#d9d2c0'; g.beginPath(); g.arc(gx(-3.6), gz(5.6), 3.1 * TP, 0, 7); g.fill();               // fountain plaza
    g.fillStyle = '#bdb4a0'; g.beginPath(); g.arc(gx(-3.6), gz(5.6), 2.6 * TP, 0, 7); g.fill();

    g.fillStyle = '#4aa0e8'; g.beginPath(); g.ellipse(gx(-7.2), gz(8.5), 3.0 * TP, 2.0 * TP, 0, 0, 7); g.fill();
    g.fillStyle = '#d8f0ff';
    for (let i = 0; i < 9; i++) { const a = i * 2.4 + frame * 1.1, r = 2.4 * TP * (0.35 + (i % 3) * .25); g.fillRect((gx(-7.2) + Math.cos(a) * r * 1.2) | 0, (gz(8.5) + Math.sin(a) * r * .7) | 0, 6, 2); }

    for (let i = 0; i < 90; i++) { const x = rnd() * GW * TP | 0, y = rnd() * GH * TP | 0; g.fillStyle = ['#ffffff', '#ffd23a', '#ff7aa8'][i % 3]; g.fillRect(x, y, 2, 2); }
  });
}
const gTex = [drawGround(0), drawGround(1), drawGround(2)];

const box = (w, h, d, c, x, y, z, p = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c)); m.position.set(x, y, z); p.add(m); return m; };

}

const trees = [];
[[-10, -2], [-11.5, 3], [-9.5, 11], [-11, 15], [10.5, -4], [11.5, 1], [10, 6], [11, 11], [10.5, 15], [-2.6, -7], [6, -7], [-8, -7], [9, -8], [-11, -8], [3, -9], [-5, -9.5], [8, 15.5], [-3.6, 13.5]]

facade(3.2, 3.2, 3, 0xf6c98a, 0xc2562f, -9, 2.5, 2, 2); awning(-9, 4.2, 2.2, 0x3aa86a, 0xffffff); box(.7, 1.4, .1, 0x7a4e2c, -9, .7, 4.02);
